[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[project]
name = "elf"
version = "0.1.0"
authors = [
  {name = "Yosuke Kobayashi", email = "yosuke.kobayashi@cc.kyoto-su.ac.jp"},
  {name = "Kazuyuki Akitsu", email = "kakitsu@ias.edu"},
]
description = "JAX code for galaxy power spectrum based on one-loop perturbation theory"
readme = "README.md"
license = {file = "LICENSE"}
requires-python = ">=3.11"
dependencies = [
    "numpy>=2.0",
    "scipy>=1.13",
    "jax>=0.9.2",
]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
]

[project.optional-dependencies]
# the table generator tools/ptgen (not part of the runtime package)
ptgen = ["sympy>=1.12"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
elf = ["pt_matrix/*.txt", "pt_coeff/*.txt", "tables/*.npz", "tables/manifest.json"]

[project.urls]
Homepage = "https://github.com/archaeo-pteryx/elf"
